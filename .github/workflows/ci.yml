
name: "🧪 CI: Build"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.14"

    - name: Install Dependencies
      run: |
        scripts/install.sh

    - name: Lint with flake8, black, isort
      run: |
        scripts/lint.sh

    - name: Test with pytest
      run: |
        scripts/test.sh
